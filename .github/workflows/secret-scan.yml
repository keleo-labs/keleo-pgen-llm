# Server-side backstop for the local pre-commit hooks.
#
# The difference that matters: these jobs scan FULL HISTORY, not the staged
# diff. That is what catches a secret committed before the hooks existed, or
# pushed by someone who bypassed them.
#
# fetch-depth: 0 is required. The default shallow clone gives the scanners one
# commit to look at, which quietly reduces this to the same scope as the hook.
#
# These are plain container jobs rather than the vendors' marketplace actions.
# gitleaks-action@v2 refuses to run on an organisation-owned repository without
# a paid GITLEAKS_LICENSE, and the trufflehog action compares BASE to HEAD,
# which it cannot do on the first push of a new branch. Both failed here for
# those reasons while the scanners themselves passed locally. Running the
# published images directly avoids both and scans exactly what the hooks scan.

name: secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.30.1
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The checkout is owned by a different uid than the container user, and
      # git refuses to read a repository it considers foreign.
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: gitleaks
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  trufflehog:
    runs-on: ubuntu-latest
    container:
      image: trufflesecurity/trufflehog:3.97.9
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # --only-verified calls the provider's API to confirm a credential is
      # live, so an expired token in old history does not fail the build.
      - name: trufflehog
        run: trufflehog git file://. --only-verified --fail --no-update
